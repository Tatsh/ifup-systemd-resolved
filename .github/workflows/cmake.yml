---
jobs:
  build-linux:
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules
      - name: Install Qt
        uses: Tatsh/install-qt-action@c06aab43ae9bf6a28175c9cf45dd5936d44e21e9
      - name: Configure
        run: >-
          cmake -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -B ${{github.workspace}}/build
          --install-prefix ${{github.workspace}}/build/AppDir/usr
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
      - name: Build
        run: cmake --build ${{github.workspace}}/build --verbose --config ${{matrix.build-type}}
      - name: Install
        run: cmake --install ${{github.workspace}}/build --config ${{matrix.build-type}} --verbose
      - name: Package
        run: >-
          cpack -C ${{matrix.build-type}}
          --config ${{github.workspace}}/build/CPackConfig.cmake --verbose
      - name: Create AppImage
        env:
          DEPLOY_ARCH: ${{ matrix.arch.deploy_arch }}
        run: |
          wget "https://github.com/TheAssassin/linuxdeploy/releases/download/continuous/linuxdeploy-${DEPLOY_ARCH}.AppImage"
          wget "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${DEPLOY_ARCH}.AppImage"
          chmod +x "linuxdeploy-${DEPLOY_ARCH}.AppImage" "linuxdeploy-plugin-qt-${DEPLOY_ARCH}.AppImage"
          export QMAKE="$(command -v qmake6)"
          mkdir -p ${{github.workspace}}/build/AppDir/usr/share/icons/hicolor/scalable/apps
          wget 'https://raw.githubusercontent.com/GNOME/adwaita-icon-theme/refs/heads/master/src/fullcolor/application-x-generic.source.svg' -O ${{github.workspace}}/build/AppDir/usr/share/icons/hicolor/scalable/apps/application-x-generic.svg
          cat > ${{github.workspace}}/build/ifup-systemd-resolved.desktop <<EOF
          [Desktop Entry]
          Categories=Utility;
          Exec=ifup-systemd-resolved %u
          Icon=application-x-generic
          Name=ifup-systemd-resolved
          NoDisplay=true
          Type=Application
          Version=1.5
          EOF
          "./linuxdeploy-${DEPLOY_ARCH}.AppImage" --appdir ${{github.workspace}}/build/AppDir --plugin qt --output appimage --desktop-file ${{github.workspace}}/build/ifup-systemd-resolved.desktop
          rm "./linuxdeploy-${DEPLOY_ARCH}.AppImage" "./linuxdeploy-plugin-qt-${DEPLOY_ARCH}.AppImage"
          mv -v ${{github.workspace}}/*.AppImage "${{github.workspace}}/ifup-systemd-resolved-${{matrix.build-type}}-${DEPLOY_ARCH}.AppImage"
      - env:
          DEPLOY_ARCH: ${{ matrix.arch.deploy_arch }}
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Rename with tag
        run: mv -v "${GITHUB_WORKSPACE}"/ifup-systemd-resolved-*.AppImage "${GITHUB_WORKSPACE}/ifup-systemd-resolved-${TAG}-${DEPLOY_ARCH}.AppImage"
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: ifup-systemd-resolved-${{ matrix.build-type }}-Linux-${{ matrix.arch.deploy_arch }}
          path: |
            ${{github.workspace}}/ifup-systemd-resolved-*.AppImage
            ${{github.workspace}}/ifup-systemd-resolved-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/ifup-systemd-resolved-*.AppImage
            ${{github.workspace}}/ifup-systemd-resolved-*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Upload package
        run: |
          shopt -s nullglob
          files=("${GITHUB_WORKSPACE}"/ifup-systemd-resolved-*.AppImage)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo '::error::No AppImage was produced; refusing to attach an incomplete release.'
            exit 1
          fi
          # Every architecture uploads to the same draft, so tolerate another job winning the
          # create.
          for _ in 1 2 3; do
            gh release view --repo "$REPO" "$TAG" >/dev/null 2>&1 && break
            gh release create --repo "$REPO" "$TAG" --draft --title "$TAG" --notes '' && break
            sleep 5
          done
          gh release view --repo "$REPO" "$TAG" >/dev/null
          gh release upload --repo "$REPO" "$TAG" "${files[@]}" --clobber
    strategy:
      fail-fast: false
      matrix:
        arch:
          - deploy_arch: aarch64
            runner: ubuntu-24.04-arm
          - deploy_arch: x86_64
            runner: ubuntu-latest
        build-type: [Debug, Release]
name: Build
'on':
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master]
permissions:
  attestations: write
  contents: write
  id-token: write
